name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}

    - name: Check that commits only modify files (no add or remove)
      run: |
        if git diff --name-status origin/main HEAD | grep -E '^[AD]\s+'; then
          echo "Error: Not allowed to add or remove files in this repo."
          exit 1
        fi

    - name: Validate commit messages format
      run: |
        git log origin/main..HEAD --oneline --no-merges | while read line; do
          commit_msg=$(echo "$line" | cut -d' ' -f2-)
          echo "Checking commit: $commit_msg"
          if [[ ! "$commit_msg" =~ ^(feat|fix|chore|docs|refactor|test)(\(.+\))?:\ .+ ]]; then 
            echo "❌ Invalid commit message: '$COMMIT_MSG'. Must follow 'type(scope): message' format."
            exit 1
          fi
          echo "✔ Commit message is valid."
        done          

    - name: Validate branch naming format
      run: |
        branch_name=$(echo "${{ github.head_ref }}" | sed 's|refs/heads/||')
        echo "Branch name is: $branch_name"
        if [[ ! "$branch_name" =~ ^(feature|fix|chore|docs)/.+$ ]]; then
          echo "❌ Invalid branch name: '$branch_name'. Must follow 'feature/*', 'fix/*', etc."
          exit 1
        fi
        echo "✔ Branch name is valid."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Node dependencies
      run: |
        cd javascript
        npm ci

    - name: Install Zig using Snap
      run: sudo snap install zig --classic --beta

    - name: Build Zig
      run: zig build

    - name: Extract issue number from PR
      id: issue-number
      uses: actions/github-script@v7
      with:
        script: |
          const body = context.payload.pull_request.body || '';
          const match = body.match(/#(\d+)/);
          if (!match) {
            core.setFailed('No issue number found in PR body');
          } else {
            core.setOutput('number', match[1]);
          }

    - name: Get issue title
      id: issue-title
      uses: actions/github-script@v7
      env:
        ISSUE_NUMBER: ${{ steps.issue-number.outputs.number }}
      with:
        script: |
          const { data } = await github.rest.issues.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: process.env.ISSUE_NUMBER,
          });
          core.setOutput('title', data.title.trim());

    - name: Run property test
      id: run-test
      run: |
        cd javascript
        npm test run tests/${{ steps.issue-title.outputs.title }}.test.js

    - name: Enable PR automerge
      if: steps.run-test.outcome == 'success'
      uses: peter-evans/enable-pull-request-automerge@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment on failure
      if: steps.run-test.outcome == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: '❌ The issue is not fixed. Property still failing.'
          });


#trigger push ci