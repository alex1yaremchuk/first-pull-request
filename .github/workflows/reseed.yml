name: Reseed Exercises

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  reseed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reseed merged exercise after 24 hours
        id: reseed
        run: node scripts/reseed-exercise.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit reseeded exercise
        if: steps.reseed.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="chore/reseed-${{ steps.reseed.outputs.exercise }}-after-pr-${{ steps.reseed.outputs.pull }}"
          branch="${branch//./-}"
          git checkout -b "$branch"
          git add .
          git commit -m "chore: reseed ${{ steps.reseed.outputs.exercise }}"
          git push --force-with-lease origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open reseed pull request
        if: steps.reseed.outputs.changed == 'true'
        id: pull-request
        run: |
          title="chore: reseed ${{ steps.reseed.outputs.exercise }}"
          body=$(cat <<'BODY'
          Restores the training bug after the contributor fix has been visible for at least 24 hours.

          Source PR: #${{ steps.reseed.outputs.pull }}
          Exercise issue: #${{ steps.reseed.outputs.issue }}

          This PR intentionally makes the matching exercise fail again for the next contributor.
          BODY
          )
          pr_url=$(gh pr create \
            --base main \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "$title" \
            --body "$body")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for reseed pull request
        if: steps.reseed.outputs.changed == 'true'
        run: gh pr merge "${{ steps.pull-request.outputs.url }}" --squash --auto --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
