name: Test and Report

on:
  push:
    branches:
      - main

jobs:
  zig-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - name: Install Zig using Snap
        run: |
          sudo snap install zig --classic --beta

      - name: Config, Prepare branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout gh-pages || git checkout -b gh-pages
          git merge main --no-edit

      - name: Compile to WebAssembly
        run: |
          zig build

      - name: Commit built files to gh-pages
        run: |
          cp zig-out/bin/index.wasm .
          git add index.wasm
          git commit --allow-empty -m 'Update built index.wasm file'
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set
        run: |
          files=(javascript/tests/*.test.js)
          json='['
          sep=''
          for f in "${files[@]}"; do
            filename=$(basename "$f")
            prop="${filename%.test.js}"
            json="$json$sep{\"file\":\"tests/$filename\",\"prop\":\"$prop\"}"
            sep=',' 
          done
          json="$json]"
          echo "matrix=$json" >> $GITHUB_OUTPUT

  run-pbt-tests:
    needs:
      - zig-build-publish
      - set-matrix
    runs-on: ubuntu-latest
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd javascript
          npm ci

      - name: Run test ${{ matrix.prop }}
        id: run-test
        continue-on-error: true
        run: |
          cd javascript
          FORCE_COLOR=0 npm test ${{ matrix.file }} > ../test-failure-${{ matrix.prop }}.md 2>&1
          cd ..
          perl -pi -e 's/\e\[[0-9;]*[A-Za-z]//g' test-failure-${{ matrix.prop }}.md

      - name: Create issue on failure
        if: steps.run-test.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Test failed: ${{ matrix.prop }}"
          content-filepath: test-failure-${{ matrix.prop }}.md
          token: ${{ secrets.GITHUB_TOKEN }}
