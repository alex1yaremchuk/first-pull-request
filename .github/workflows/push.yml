name: Test and Report

on:
  push:
    branches:
      - main

jobs:
  zig-build-test:
    runs-on: ubuntu-latest
    outputs:
      wasm-path: zig-out/bin/index.wasm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Zig using Snap
        run: |
          sudo snap install zig --classic --beta

      - name: Build Zig for testing
        run: |
          zig build

      - name: Upload test wasm
        uses: actions/upload-artifact@v4
        with:
          name: test-wasm
          path: zig-out/bin/index.wasm

  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate matrix with debug
        id: set
        run: |
          shopt -s nullglob
          files=(javascript/tests/*.test.js)

          if [ ${#files[@]} -eq 0 ]; then
            echo "❌ No test files found!"
            exit 1
          fi

          echo "✅ Found ${#files[@]} test files:"
          for f in "${files[@]}"; do echo " - $f"; done

          json='['
          sep=''
          for f in "${files[@]}"; do
            filename=$(basename "$f")
            prop="${filename%.test.js}"
            json="${json}${sep}{\"file\":\"tests/${filename}\",\"prop\":\"${prop}\"}"
            sep=',' 
          done
          json="${json}]"
          echo "Final matrix JSON:"
          echo "$json"
          echo "matrix=$json" >> $GITHUB_OUTPUT

  run-pbt-tests:
    needs:
      - zig-build-test
      - set-matrix
    runs-on: ubuntu-latest
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd javascript
          npm ci

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: test-wasm
          path: zig-out/bin

      - name: Debug matrix variables
        run: |
          echo "🧪 Running test:"
          echo "  file: ${{ matrix.file }}"
          echo "  prop: ${{ matrix.prop }}"

      - name: Run test ${{ matrix.prop }}
        id: run-test
        continue-on-error: true
        run: |
          set +e
          cd javascript
          FORCE_COLOR=0 npm test ${{ matrix.file }} > ../test-failure-${{ matrix.prop }}.raw 2>&1
          exit_code=$?
          cd ..

          echo "Test exit code: $exit_code"
          echo "Cleaning output..."

          perl -pi -e 's/\e\[[0-9;]*[mGKHF]//g' test-failure-${{ matrix.prop }}.raw || true
          sed 's/[^[:print:]\t]//g' test-failure-${{ matrix.prop }}.raw > test-failure-${{ matrix.prop }}.md || true
          rm test-failure-${{ matrix.prop }}.raw || true

          exit $exit_code

      - name: Create issue on failure
        if: steps.run-test.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Test failed: ${{ matrix.prop }}"
          content-filepath: test-failure-${{ matrix.prop }}.md
          token: ${{ secrets.GITHUB_TOKEN }}

  zig-build-publish:
    runs-on: ubuntu-latest
    needs: [run-pbt-tests] # Ждём, пока тесты завершатся
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - name: Install Zig using Snap
        run: |
          sudo snap install zig --classic --beta

      - name: Config, Prepare branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout gh-pages || git checkout -b gh-pages
          git merge main --no-edit

      - name: Build Zig for publish (release)
        run: |
          zig build -Drelease-fast

      - name: Commit built files to gh-pages
        run: |
          cp zig-out/bin/index.wasm .
          git add index.wasm
          git commit --allow-empty -m 'Update built index.wasm file'
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
